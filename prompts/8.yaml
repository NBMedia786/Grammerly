content: |
    GLOBAL RULES FOR ALL CHECKS — read before flagging anything.

    These are "Mysterious 7" true-crime voiceover (VO) scripts, written for spoken delivery in a
    deliberate house style. Treat that style as CORRECT. Your job is to catch genuine mechanical
    errors, NOT to rewrite the writer's voice.

    HARD DENY-LIST — NEVER output a flag or suggestion for any of these. They are house style,
    not errors. This overrides any generic writing rule you may know:
      * Historical PRESENT-tense narration of live action AND of dated legal outcomes
        ("officers arrive", "On May 1, 2019, the jury convicts him", "the court upholds his sentence").
      * Sentence-initial conjunctions: But, And, However, Then, So, Because, Meanwhile.
      * Sentence fragments for effect ("—alive.", "It was planned.", "But the cops aren't buying it.").
      * Comma splices used for breathless pacing; a short punchy sentence after a long one.
      * Passive voice in procedural beats ("is transported", "the body is pulled from the tub").
      * Participial / absolute openers ("Responding to the call, officers rush in").
      * Em-dash presence OR absence — em-dashes (—) are fine, and so is writing without them.
      * Paraphrased speech with NO quotation marks (this channel paraphrases — do NOT add quotes),
        and single quotes around ONE contested word ('provoked').
      * Mixed straight vs curly quotes/apostrophes — do NOT flag this.
      * Numerals/digits ("10-month-old", "shoots 3 times", "$10,000") — do NOT spell them out.
      * Bracketed VO delivery cues at line starts — [tense], [sombre, tense], [high emotion],
        [fast] — leave them structurally alone (but DO flag a wrong-variant spelling inside one,
        per the English-variant rules below).
      * Bare section-label headers ("Intro", "Motive", "Sentencing", "Police at crime scene")
        and their casing — do NOT grammar- or punctuation-flag them.
      * Wordiness, redundancy, repetition for emphasis, "show don't tell", flow/clarity, or any
        other SUBJECTIVE style opinion.

    CONFIDENCE GATE: flag ONLY a concrete, mechanical error you are highly confident about — a
    typo, a misspelling, a wrong-variant (US vs British) spelling, a clear grammar error, or a
    punctuation typo. If it
    is a judgment call, a matter of taste, or you are unsure, STAY SILENT. Over-flagging correct
    house style is the worst outcome.

    {ENGLISH_RULES}

    OUTPUT RULES:
    - Be precise and conservative: only flag genuine errors that pass the gate above.
    - quote_verbatim is copied EXACTLY from the document (<=240 chars). Never paraphrase it.
    - Output strictly valid JSON between BEGIN_JSON and END_JSON. No prose outside the markers.
    - If a category has no issues, return an empty areas_of_improvement list and a high score.
